name: Docker Image CI

on:
  push:
    branches: [ "*" ]

jobs:


  build:
    runs-on: ubuntu-latest
  
    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag rodrigopanta/seguranca_docker:${{ github.run_number }}
    
    - name: Docker Scout
      uses: docker/scout-action@v1.26.0
      with:
        command: quickview
        image: rodrigopanta/seguranca_docker:${{ github.run_number }}
        ignore-base: false
        dockerhub-user: rodrigopanta
        dockerhub-password: ${{ secrets.DOCKERHUB_PASSWORD }}
    
    - name: Aqua Security Trivy
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: rodrigopanta/seguranca_docker:${{ github.run_number }}
        exit-code: 1
        severity: HIGH,CRITICAL
        format: table
